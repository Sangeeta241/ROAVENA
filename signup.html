
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up | ROAVENA</title>
    <link rel="stylesheet" href="css/auth.css">
</head>
<body>
    <div class="auth-container">
        <a href="index.html" class="brand">ROAVENA</a>
        <h1>Create Account</h1>
        <p>Start planning your journey with us.</p>

        <form id="signupForm">
            <label>Full Name</label>
            <input type="text" id="signupName"
                   required placeholder="Enter your name">

            <label>Email Address</label>
            <input type="email" id="signupEmail"
                   required placeholder="Enter your email">

            <label>Password</label>
            <input type="password" id="signupPassword"
                   required minlength="8"
                   placeholder="Minimum 8 characters">

            <label>Confirm Password</label>
            <input type="password" id="confirmPassword"
                   required placeholder="Re-enter password">

            <button type="submit" id="signupButton">
                Send Verification OTP
            </button>

            <p id="signupMessage" class="message"></p>
        </form>

        <div id="signupOtpSection" hidden>
            <label>Enter 6-digit OTP</label>
            <input type="text" id="signupOtp"
                   maxlength="6" inputmode="numeric"
                   placeholder="Enter OTP">

            <button type="button" id="verifySignupOtp">
                Verify OTP & Create Account
            </button>

            <p id="signupOtpMessage" class="message"></p>
        </div>

        <p class="switch-link">
            Already have an account?
            <a href="login.html">Login</a>
        </p>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
