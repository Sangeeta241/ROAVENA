
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Operator Login | ROAVENA</title>
    <link rel="stylesheet" href="css/auth.css">
</head>
<body>
    <div class="auth-container">
        <a href="index.html" class="brand">ROAVENA</a>
        <h1>Operator Login</h1>
        <p>Access your tour management dashboard.</p>

        <form id="operatorLoginForm">
            <label>Operator Email</label>
            <input type="email" id="operatorEmail"
                   required placeholder="Enter operator email">

            <label>Password</label>
            <input type="password" id="operatorPassword"
                   required placeholder="Enter operator password">

            <button type="submit">Login as Operator</button>
            <p id="operatorLoginMessage" class="message"></p>
        </form>

        <p class="switch-link">
            <a href="login.html">Back to Customer Login</a>
        </p>
    </div>

    <script src="js/auth.js"></script>
</body>
</html>
